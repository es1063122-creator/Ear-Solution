<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/Ear-Solution/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Auris - tinnitus sound care, desync sound, haptic relaxation, 4-7-8 breathing, and HD sound mixer.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#061522">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Auris">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Auris</title>

  <style>
    :root {
      --bg: #061522;
      --bg2: #0b2539;
      --line: rgba(255,255,255,0.16);
      --text: #f4fbff;
      --sub: #b7d4e8;
      --accent: #55e3e8;
      --accent2: #8a7cff;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 20% 16%, rgba(85,227,232,.24), transparent 32%),
        radial-gradient(circle at 82% 18%, rgba(138,124,255,.20), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      z-index: 9999;
      transition: opacity .25s ease;
    }

    .panel {
      width: min(420px, 92vw);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      padding: 26px 22px;
      text-align: center;
      box-sizing: border-box;
    }

    .app-icon {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      border-radius: 24px;
      display: block;
      box-shadow: 0 0 46px rgba(85,227,232,.30);
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .subtitle {
      margin: 8px 0 18px;
      color: var(--sub);
      line-height: 1.45;
      font-size: 14px;
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.10);
      margin: 18px 0 14px;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 36%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      animation: loadingMove 1.35s ease-in-out infinite;
    }

    @keyframes loadingMove {
      0% { transform: translateX(-100%); }
      55% { transform: translateX(170%); }
      100% { transform: translateX(260%); }
    }

    .notice {
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      color: #d9f7ff;
      background: rgba(85,227,232,.10);
      border: 1px solid rgba(85,227,232,.18);
      font-size: 12px;
      line-height: 1.5;
    }

    .small {
      margin-top: 10px;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      line-height: 1.35;
    }

    #installTip {
      display: none;
      margin-top: 12px;
      color: #ffffff;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-height: 640px) {
      .panel { padding: 18px 16px; border-radius: 22px; }
      .app-icon { width: 70px; height: 70px; border-radius: 20px; }
      h1 { font-size: 26px; }
      .notice { display: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="panel">
      <img class="app-icon" src="icons/Icon-192.png" alt="Auris icon">
      <h1>Auris</h1>
      <div class="subtitle">
        Sound care for tinnitus support<br>
        Desync sound · HD mixer · Breathing routine
      </div>
      <div class="bar"><span></span></div>
      <div class="notice">
        iPhone Safari test mode<br>
        Some native Android features such as phone vibration or native MP3 L/R control may be limited on web.
      </div>
      <div id="installTip">
        iPhone에서 테스트 후 공유 버튼 → “홈 화면에 추가”로 웹앱처럼 실행할 수 있습니다.
      </div>
      <div class="small">Loading Auris...</div>
    </div>
  </div>

  <script>
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.getElementById('installTip').style.display = 'block';
    }

    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 320);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
